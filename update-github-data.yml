name: Update GitHub data

on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes (GitHub may delay it a few minutes)
  workflow_dispatch:               # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write

concurrency:
  group: update-github-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch GitHub data
        run: node scripts/fetch-github-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
      - name: Fetch GitHub status history
        run: node scripts/fetch-github-status.mjs
        continue-on-error: true         # a status-page hiccup must never stop the main data from being saved
      - name: Save it if it changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update GitHub data"
            git pull --rebase
            git push
          else
            echo "Nothing to save."
          fi
